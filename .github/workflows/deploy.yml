name: Deploy to Yandex Cloud Functions

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Write SA key
        run: |
          echo '${{ secrets.TF_SA_KEY }}' > ../sa-key.json

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_tg_token: ${{ secrets.TG_TOKEN }}
          TF_VAR_ym_token: ${{ secrets.YM_TOKEN }}
          TF_VAR_sa_key_file: ../sa-key.json

      - name: Cleanup
        if: always()
        run: rm -f ../sa-key.json
